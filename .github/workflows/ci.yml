name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_probe:
        description: Windows 시험 설치 파일을 만든다
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: REL-01 검사 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust 도구 설치 (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 테스트
        run: pnpm test
      - name: 타입 검사
        run: pnpm typecheck
      - name: spec 검사
        run: pnpm spec:check
      - name: Rust 형식 검사
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml --all
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Rust lint (측정 빌드)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p todo-widget --features probe -- -D warnings
      - name: Rust 테스트
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --exclude todo-widget
      - name: PRIV-01 Rust 네트워크 crate 검사
        run: pnpm privacy:check
      - name: 빌드 확인
        run: pnpm tauri build --debug --no-bundle

  windows-probe:
    name: Windows 시험 설치 파일
    if: github.event_name == 'workflow_dispatch' && inputs.windows_probe
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis --features probe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: todowidget-windows-probe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
