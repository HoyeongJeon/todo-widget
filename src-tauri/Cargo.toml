[package]
name = "todo-widget"
version = "2.0.0"
description = "늘 떠 있는 작은 할 일 위젯"
edition = "2021"

[lib]
name = "todo_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[workspace]
members = ["crates/core", "crates/windows"]

[dependencies]
tauri = { version = "=2.12.1", features = ["macos-private-api"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todowidget-core = { path = "crates/core" }

[target.'cfg(windows)'.dependencies]
todowidget-windows = { path = "crates/windows" }

# 메뉴 막대 아이콘은 macOS만 쓴다(설계 문서 6장). Windows 빌드에는 tray 코드를 넣지 않는다.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.12.1", features = ["macos-private-api", "tray-icon"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
objc2 = "0.6"
# 기본 feature는 AppKit·Foundation 전체를 켜서 빌드가 느려진다. 쓰는 것만 켠다.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
